name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch content if missing
        run: |
          if [ ! -f index.html ]; then
            curl -fL --retry 3 --retry-delay 5 --max-time 600 -o content.zip "https://aka.doubaocdn.com/s/9dMHexI1mV"
            unzip -q content.zip -d .
            rm -f content.zip
          fi
          ls -1 index.html posts.json
          du -sh assets
      - name: Save content to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html posts.json assets
          if ! git diff --cached --quiet; then
            git commit -m "chore: add site content [skip ci]"
            git push
          fi
      - name: Build site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp posts.json _site/
          cp -r assets _site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
